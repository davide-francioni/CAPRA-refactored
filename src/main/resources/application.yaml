spring:
  application:
    name: swe-audit-agent
  data:
    mongodb:
      host: localhost
      port: 27017
      database: features_repo
  ai:
    # These blocks feed Spring AI's autoconfigured models, which the blueprint mechanism no
    # longer uses: every role's client is built by ChatClientFactory from the blueprint
    # below. They are kept only because the autoconfiguration still runs.
    #
    # The keys carry a fallback on purpose. In a benchmark run the models are local engines
    # needing no authentication, and without a fallback an unset variable would stop the
    # application at startup for the sake of beans nobody calls.
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-5.1
          max-completion-tokens: 16000
          temperature: 0.0
          seed: 42
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 8192
          temperature: 0.0
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 2000
        multiplier: 2
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true

server:
  port: 8085

audit:
  pdf-service:
    base-url: http://localhost:5001
  latex:
    output-dir: ./reports
    pdflatex-path: pdflatex

# ── Blueprint: which model answers for which role ──────────────────────────────────────
# This is the DEFAULT, reproducing CAPRA's original setup: GPT-5.1 for the six analysis
# roles, Claude Haiku for the LaTeX report. A benchmark run overrides it with an external
# file passed at startup:
#
#   java -jar capra.jar --spring.config.additional-location=file:/path/blueprint.yaml
#
# Every one of the seven roles must be resolvable, or startup fails. That is deliberate:
# the role list is duplicated in the benchmarking platform, and a mismatch should surface
# as an immediate error rather than as odd results.
#
# Map keys use bracket notation so that the enum names reach the binder unaltered.
blueprint:
  id: baseline-original
  description: Original CAPRA configuration
  intervention-level: L0_SOSTITUZIONE
  defaults:
    provider: openai
    api-key: ${OPENAI_API_KEY:not-set}
    model: gpt-5.1
    timeout-seconds: 300
    options:
      temperature: 0.0
      seed: 42
      max-completion-tokens: 16000
  roles:
    "[LATEX_REPORT]":
      provider: anthropic
      api-key: ${ANTHROPIC_API_KEY:not-set}
      model: claude-haiku-4-5-20251001
      options:
        temperature: 0.0
        max-tokens: 8192
  retry:
    # Outside a benchmark the original behaviour is kept, both retry layers included.
    # A benchmark blueprint sets this to false: transport retry absorbs infrastructure
    # failures and reports them as successes.
    spring-ai-enabled: true
    application-max-attempts: 3

logging:
  level:
    com.example.demo: DEBUG
